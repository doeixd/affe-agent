name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is 22.5: node:sqlite (the durable journal's storage) and the
        # undici pulled in by the SDK adapters do not exist on Node 20.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Typecheck, the Effect language service, and the test suite. The language
      # service catches Effect-specific mistakes tsc cannot see, so it is a gate
      # rather than advice.
      - run: npm run check

      - run: npm run build

      # Nothing tracked should change as a side effect of building. A generated
      # file written into a tracked path (an errant codegen step, a stale
      # snapshot) would otherwise slip in unnoticed; here it fails the build.
      # `dist/` is gitignored, so a clean build leaves the tree clean.
      - name: Working tree is clean after build
        run: git diff --exit-code

      # The suite proves the source is sound and says nothing about whether the
      # package is. Every exported subpath must resolve from the tarball; a
      # wrong path or missing build output is invisible to source tests and
      # visible to the first person who installs it.
      - run: npm run verify:package

  mcp-v1-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Keep latest-v1 runtime conformance in the normal suite while compiling
      # the same adapter against the oldest v1 declarations we advertise.
      - run: npm install --no-save --package-lock=false mcp-sdk-v1-floor@npm:@modelcontextprotocol/sdk@1.10.0
      - run: npx tsc --noEmit -p tsconfig.mcp-v1-floor.json
